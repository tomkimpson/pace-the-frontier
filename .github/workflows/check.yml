name: Check

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate data and build
        run: npm run build
      - name: Quote check (informational)
        run: node scripts/verify-quotes.mjs --out verify-report.md && cat verify-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Relevance check on changed calls (informational)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODEL: ${{ vars.AGENT_MODEL || 'claude-sonnet-5-5' }}
        run: |
          changed=$(git diff --name-only --diff-filter=AM "origin/${{ github.base_ref }}...HEAD" -- 'src/data/calls/*.yaml')
          if [ -z "$changed" ]; then echo "No call entries changed."; exit 0; fi
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo "No API key available (fork PR?); skipping." >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          node scripts/check-relevance.mjs --out relevance-report.md $changed
          cat relevance-report.md >> "$GITHUB_STEP_SUMMARY"
