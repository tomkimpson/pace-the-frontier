person: Ursula von der Leyen
role: President, European Commission
sector: government
country: EU
date: 2026-09-16
quote: And CEOs of the most advanced companies tell us that it is time to slow down on the self-recursive models. To pace the frontier. If the people developing the technology are clear, then we should be too.
summary: 2026 State of the Union address.
notes: 'Found in the 2026-11-15 review. Quote switched (2026-11-15) from her follow-up commitment to this passage, where she relays the CEOs'' view and then endorses it ("then we should be too"). The follow-up: "And I will invite the main frontier labs for a discussion on how we can support ongoing industry efforts to pace the frontier." The judge noted she also says Europe must "stay in the race".'
