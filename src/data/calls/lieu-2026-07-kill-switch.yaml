quote: It is imperative that these AI systems have kill switches so we can keep this technology from causing catastrophic harm, and that the federal government has the clear authority and process to shut down rogue AI models.
summary: Introducing the AI Kill Switch Act with Rep. Nathaniel Moran.
notes: 'Found in the 2026-11-15 review. Kill switch for deployed systems; the bill also lets the government "order a slow down or shutdown". Scope question: off-switches for deployed models rather than the pace of development.'
