title: Statement on Superintelligence
organiser: Future of Life Institute
date: 2025-10-22
ask: "We call for a prohibition on the development of superintelligence, not lifted before there is (1) broad scientific consensus that it will be done safely and controllably, and (2) strong public buy-in."
url: https://superintelligence-statement.org/
signatories: 134015
signatories_as_of: 2026-11-12
stance: prohibit
notable: [Geoffrey Hinton, Yoshua Bengio, Steve Wozniak, Mary Robinson, Stephen Fry, Yuval Noah Harari]
verified: false
